<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mengarahkan ke Google Review...</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 100px; background: #f4f6f8; color: #333; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #1a73e8; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h3 id="info">Sedang menghubungkan ke halaman tujuan...</h3>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const cardId = urlParams.get('id');

        if (!cardId) {
            document.getElementById('info').innerText = "Error: ID Kartu tidak ditemukan di URL.";
        } else {
            // Ganti URL di bawah ini dengan URL Web App /exec Google Apps Script Anda yang terbaru
            const scriptUrl = "https://script.google.com/macros/s/AKfycbwwX_lTuBp2V0cDlWtkSQRpEQHqMgy5udWbdKdnJWv27ItB0vFOKJxD_Ye745FAJYmPPg/exec?id=" + cardId;

            fetch(scriptUrl)
                .then(response => response.json())
                .then(data => {
                    if (data.status && data.status.toLowerCase() === "activated" && data.url) {
                        let targetUrl = data.url;
                        if (!targetUrl.startsWith("http://") && !targetUrl.startsWith("https://")) {
                            targetUrl = "https://" + targetUrl;
                        }
                        document.getElementById('info').innerText = "Mengalihkan...";
                        window.location.replace(targetUrl);
                    } else if (data.status && data.status.toLowerCase() === "disconnect") {
                        document.getElementById('info').innerText = "Maaf, kartu ini telah dinonaktifkan.";
                    } else {
                        document.getElementById('info').innerText = "Kartu NFC ini belum diaktivasi untuk toko mana pun.";
                    }
                })
                .catch(error => {
                    document.getElementById('info').innerText = "Gagal memuat data dari server. Silakan scan ulang.";
                });
        }
    </script>
</body>
</html>
